name: Standard-library tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check renderer helper syntax
        run: node --check buddygate/desktop_console.mjs
      - name: Simulated renderer helper checks
        run: node scripts/check_desktop_helper.mjs
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
